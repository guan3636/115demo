{% extends "base.html" %}{% block title %}{{ '編輯投稿' if mode=='edit' else '新增投稿' }} · 布丁投稿室{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">WRITE YOUR STORY ✦</div><h1>{{ '編輯你的文章' if mode=='edit' else '寫一篇新文章' }} ✎</h1><p class="muted">每一篇好文章，都從第一個字開始。</p></div><a class="btn secondary" href="/dashboard">← 返回清單</a></div><section class="panel form-panel"><div class="panel-header"><div><h2>文章資料</h2><p class="muted">慢慢寫，好的想法值得細心整理。</p></div><span class="count-chip">{{ '編輯中' if mode=='edit' else '新投稿' }}</span></div><form action="{{ '/edit/' ~ submission_id if mode=='edit' else '/submit' }}" method="post" class="submission-form"><div class="form-grid"><label>作者姓名 <span class="required">*</span><input name="author" value="{{ submission[0] if submission else '' }}" placeholder="請輸入作者姓名" required></label><label>文章類別 <span class="required">*</span><input name="category" value="{{ submission[1] if submission else '' }}" placeholder="例如：科技、生活、文學" required></label></div><label>文章標題 <span class="required">*</span><input name="title" value="{{ submission[2] if submission else '' }}" placeholder="幫你的文章取個好名字" required></label><label>文章內容 <span class="required">*</span><textarea name="content" rows="12" placeholder="在這裡寫下你的想法……" required>{{ submission[3] if submission else '' }}</textarea></label><div class="form-actions"><a class="btn secondary" href="/dashboard">取消</a><button class="btn primary" type="submit">{{ '儲存修改' if mode=='edit' else '儲存投稿' }} &nbsp; →</button></div></form></section>{% endblock %}
